{% extends "blog/base.html" %}

{% block title %}Log in{% endblock %}

{% block content %}
    <form method="post" class="form-card">
        <h1>Welcome back</h1>
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Log in</button>
        <p class="form-footer">New here? <a href="{% url 'signup' %}">Create an account</a></p>
    </form>
{% endblock %}
