{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}My Blog{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'blog/styles.css' %}">
    <script src="{% static 'blog/script.js' %}" defer></script>
</head>
<body>
    <nav class="navbar">
        <a class="brand" href="{% url 'home' %}">My Blog</a>
        <div class="nav-links">
            <button type="button" id="theme-toggle" class="theme-toggle" title="Change color theme">&#127769;</button>
            {% if user.is_authenticated %}
                <a href="{% url 'create_post' %}">New post</a>
                <span>Hello, {{ user.first_name|default:user.username }}</span>
                <form method="post" action="{% url 'logout' %}">
                    {% csrf_token %}
                    <button type="submit">Log out</button>
                </form>
            {% else %}
                <a href="{% url 'login' %}">Log in</a>
                <a class="nav-cta" href="{% url 'signup' %}">Sign up</a>
            {% endif %}
        </div>
    </nav>

    <main>
        {% block content %}{% endblock %}
    </main>

    <footer class="site-footer">
        &copy; My Blog. Built with Django.
    </footer>
</body>
</html>
