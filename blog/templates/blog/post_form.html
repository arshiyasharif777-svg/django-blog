{% extends "blog/base.html" %}

{% block title %}New post{% endblock %}

{% block content %}
    <form method="post" class="form-card">
        <h1>New post</h1>
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Save</button>
        <p class="form-footer"><a href="{% url 'home' %}">&larr; Back to home</a></p>
    </form>
{% endblock %}
